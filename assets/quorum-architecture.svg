<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Quorum architecture</title>
  <desc id="description">Quorum receives Slack events or Runtime invocations, follows a five-node Strands Graph, applies a native hook interrupt before reversible tools, and separates PostgreSQL business facts from Strands sessions, AgentCore Memory, and PII-safe OpenTelemetry. AWS managed resources are implemented as adapters but not yet deployed.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#19303c" stroke-width="1" opacity="0.42"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#81f1c8"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78909a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#02080d" flood-opacity="0.4"/>
    </filter>
    <style>
      .display { font-family: "Avenir Next Condensed", "Arial Narrow", Arial, sans-serif; font-weight: 700; }
      .body { font-family: "Avenir Next", "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; fill: #81f1c8; }
      .title { font-size: 48px; letter-spacing: -1.5px; fill: #eef2ec; }
      .subtitle { font-size: 17px; fill: #a8b4b4; }
      .node-title { font-size: 19px; fill: #eef2ec; }
      .node-subtitle { font-size: 12px; fill: #a8b4b4; }
      .small-title { font-size: 15px; fill: #eef2ec; }
      .small-copy { font-size: 11px; fill: #a8b4b4; }
      .dark-title { font-size: 18px; fill: #07131f; }
      .dark-copy { font-size: 11px; fill: #29404b; }
      .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.7px; fill: #78909a; }
      .solid-node { fill: #0d1d2b; stroke: #36525e; stroke-width: 1.5; }
      .policy-node { fill: #10271f; stroke: #48d9a7; stroke-width: 1.5; }
      .aws-node { fill: #0d1d2b; stroke: #ffad72; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .data-node { fill: #10212c; stroke: #36525e; stroke-width: 1.2; }
      .primary-line { fill: none; stroke: #81f1c8; stroke-width: 2; marker-end: url(#arrow); }
      .secondary-line { fill: none; stroke: #78909a; stroke-width: 1.5; marker-end: url(#arrow-muted); }
      .dashed-line { fill: none; stroke: #81f1c8; stroke-width: 1.5; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#07131f"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="0" y="0" width="1600" height="7" fill="#81f1c8"/>

  <text x="64" y="61" class="mono eyebrow">QUORUM · SYSTEM ARCHITECTURE</text>
  <text x="64" y="116" class="display title">Coordinate more. Interrupt less.</text>
  <text x="64" y="151" class="body subtitle">Deterministic policy in the main path; model judgment only where language is genuinely ambiguous.</text>

  <rect x="1184" y="47" width="352" height="76" rx="8" fill="#171f23" stroke="#ffad72" stroke-width="1.5" stroke-dasharray="7 5"/>
  <circle cx="1211" cy="72" r="5" fill="#ffad72"/>
  <text x="1228" y="77" class="mono" font-size="12" font-weight="700" fill="#ffcfaa">AWS TARGET PATH</text>
  <text x="1211" y="103" class="mono" font-size="11" fill="#a8b4b4">ADAPTERS BUILT · CLOUD NOT YET DEPLOYED</text>

  <text x="64" y="203" class="mono section-label">01 · DETERMINISTIC STRANDS GRAPH</text>
  <rect x="48" y="220" width="1504" height="250" rx="12" fill="#091722" stroke="#29404b"/>

  <rect x="72" y="278" width="156" height="116" rx="8" class="solid-node" filter="url(#shadow)"/>
  <text x="92" y="307" class="mono section-label">INPUT</text>
  <text x="92" y="341" class="display node-title">Slack events</text>
  <text x="92" y="364" class="display node-title">Runtime invoke</text>
  <text x="92" y="384" class="mono node-subtitle">signed · tenant scoped</text>

  <path d="M 228 336 L 254 336" class="primary-line"/>

  <rect x="258" y="278" width="174" height="116" rx="8" class="solid-node" filter="url(#shadow)"/>
  <text x="278" y="307" class="mono section-label">NODE 01</text>
  <text x="278" y="343" class="display node-title">Listener</text>
  <text x="278" y="370" class="mono node-subtitle">typed Agent</text>

  <path d="M 432 336 L 455 336" class="primary-line"/>

  <rect x="459" y="278" width="190" height="116" rx="8" class="solid-node" filter="url(#shadow)"/>
  <text x="479" y="307" class="mono section-label">NODE 02</text>
  <text x="479" y="343" class="display node-title">Ledger Curator</text>
  <text x="479" y="370" class="mono node-subtitle">source-grounded Agent</text>

  <rect x="472" y="230" width="164" height="34" rx="17" fill="#10271f" stroke="#48d9a7" stroke-dasharray="5 5"/>
  <text x="554" y="252" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#81f1c8">SWARM · AMBIGUITY ONLY</text>
  <path d="M 554 264 L 554 274" class="dashed-line"/>

  <path d="M 649 336 L 672 336" class="primary-line"/>

  <rect x="676" y="278" width="184" height="116" rx="8" class="policy-node" filter="url(#shadow)"/>
  <text x="696" y="307" class="mono section-label" fill="#81f1c8">NODE 03</text>
  <text x="696" y="343" class="display node-title">Risk Appraiser</text>
  <text x="696" y="370" class="mono node-subtitle">deterministic · 3 axes</text>

  <path d="M 860 336 L 883 336" class="primary-line"/>

  <rect x="887" y="278" width="190" height="116" rx="8" class="policy-node" filter="url(#shadow)"/>
  <text x="907" y="307" class="mono section-label" fill="#81f1c8">NODE 04</text>
  <text x="907" y="339" class="display node-title">Quorum Router</text>
  <text x="907" y="364" class="mono node-subtitle">min quorum · 24h default</text>
  <text x="907" y="382" class="mono" font-size="10" font-weight="700" fill="#81f1c8">≤ 2 INTERRUPTS / PERSON / 7D</text>

  <path d="M 1077 336 L 1102 336" class="primary-line"/>

  <path d="M 1158 274 L 1214 336 L 1158 398 L 1102 336 Z" fill="#81f1c8" stroke="#a6ffdf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1158" y="323" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#07131f">NATIVE HOOK</text>
  <text x="1158" y="341" text-anchor="middle" class="display" font-size="16" font-weight="700" fill="#07131f">INTERRUPT</text>
  <text x="1158" y="358" text-anchor="middle" class="mono" font-size="9" fill="#29404b">FAIL CLOSED</text>

  <path d="M 1214 336 L 1239 336" class="primary-line"/>

  <rect x="1243" y="278" width="178" height="116" rx="8" class="solid-node" filter="url(#shadow)"/>
  <text x="1263" y="307" class="mono section-label">NODE 05</text>
  <text x="1263" y="343" class="display node-title">Executor</text>
  <text x="1263" y="370" class="mono node-subtitle">authorized tools only</text>

  <path d="M 1421 336 L 1450 336" class="primary-line"/>
  <rect x="1454" y="294" width="74" height="84" rx="8" fill="#eef2ec"/>
  <text x="1491" y="325" text-anchor="middle" class="display dark-title">One-line</text>
  <text x="1491" y="346" text-anchor="middle" class="display dark-title">receipt</text>
  <text x="1491" y="366" text-anchor="middle" class="mono dark-copy">+ UNDO</text>

  <path d="M 1158 398 L 1158 438 L 982 438" class="secondary-line"/>
  <rect x="796" y="416" width="184" height="42" rx="7" fill="#171f23" stroke="#ff826c"/>
  <text x="888" y="442" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ffb6aa">ONE PRIVATE QUESTION</text>

  <text x="64" y="512" class="mono section-label">02 · REVERSIBLE EXECUTION</text>
  <rect x="48" y="529" width="1504" height="128" rx="12" fill="#091722" stroke="#29404b"/>

  <rect x="72" y="552" width="242" height="82" rx="8" class="aws-node"/>
  <text x="92" y="580" class="mono" font-size="10" font-weight="700" fill="#ffcfaa">AGENTCORE GATEWAY</text>
  <text x="92" y="607" class="display small-title">IAM-authenticated MCP</text>
  <text x="92" y="624" class="mono small-copy">target adapter implemented</text>

  <path d="M 314 593 L 334 593 L 334 540 L 466 540 L 466 548" class="secondary-line"/>
  <path d="M 334 540 L 706 540 L 706 548" class="secondary-line"/>
  <path d="M 334 540 L 946 540 L 946 548" class="secondary-line"/>
  <rect x="356" y="552" width="220" height="82" rx="8" class="solid-node"/>
  <text x="376" y="582" class="display small-title">Calendar</text>
  <text x="376" y="606" class="mono small-copy">tentative event · undoable</text>

  <rect x="596" y="552" width="220" height="82" rx="8" class="solid-node"/>
  <text x="616" y="582" class="display small-title">Gmail</text>
  <text x="616" y="606" class="mono small-copy">draft only · never send</text>

  <rect x="836" y="552" width="220" height="82" rx="8" class="solid-node"/>
  <text x="856" y="582" class="display small-title">Google Forms</text>
  <text x="856" y="606" class="mono small-copy">response request · undoable</text>

  <rect x="1080" y="552" width="448" height="82" rx="8" fill="#10271f" stroke="#48d9a7"/>
  <text x="1102" y="580" class="mono" font-size="10" font-weight="700" fill="#81f1c8">PRODUCT SURFACE</text>
  <text x="1102" y="605" class="display small-title">Receipt + undo · one DM · Sunday summary</text>
  <text x="1102" y="624" class="mono small-copy">no additional app</text>

  <text x="64" y="699" class="mono section-label">03 · STATE, MEMORY, AND EVIDENCE ARE SEPARATE</text>

  <rect x="48" y="716" width="346" height="106" rx="10" class="data-node"/>
  <text x="70" y="747" class="mono" font-size="10" font-weight="700" fill="#81f1c8">POSTGRESQL</text>
  <text x="70" y="776" class="display small-title">Authoritative business facts</text>
  <text x="70" y="799" class="mono small-copy">ledger · policy · budget · undo audit</text>

  <rect x="414" y="716" width="264" height="106" rx="10" class="data-node"/>
  <text x="436" y="747" class="mono" font-size="10" font-weight="700" fill="#81f1c8">STRANDS SESSION</text>
  <text x="436" y="776" class="display small-title">Graph + conversation state</text>
  <text x="436" y="799" class="mono small-copy">scoped by organization + session</text>

  <rect x="698" y="716" width="264" height="106" rx="10" class="aws-node"/>
  <text x="720" y="747" class="mono" font-size="10" font-weight="700" fill="#ffcfaa">AGENTCORE MEMORY</text>
  <text x="720" y="776" class="display small-title">Durable organization memory</text>
  <text x="720" y="799" class="mono small-copy">adapter built · resource pending</text>

  <rect x="982" y="716" width="264" height="106" rx="10" class="aws-node"/>
  <text x="1004" y="747" class="mono" font-size="10" font-weight="700" fill="#ffcfaa">AGENTCORE RUNTIME</text>
  <text x="1004" y="776" class="display small-title">Session identity + hosting</text>
  <text x="1004" y="799" class="mono small-copy">ASGI app built · deploy pending</text>

  <rect x="1266" y="716" width="286" height="106" rx="10" class="aws-node"/>
  <text x="1288" y="747" class="mono" font-size="10" font-weight="700" fill="#ffcfaa">PII-SAFE OPENTELEMETRY</text>
  <text x="1288" y="776" class="display small-title">Allow-listed correlation spans</text>
  <text x="1288" y="799" class="mono small-copy">no prompts · no tool payloads</text>

  <line x1="48" y1="855" x2="1552" y2="855" stroke="#29404b"/>
  <circle cx="64" cy="875" r="5" fill="#81f1c8"/>
  <text x="78" y="879" class="mono" font-size="10" fill="#a8b4b4">SOLID · IMPLEMENTED AND TESTED LOCALLY</text>
  <line x1="371" y1="875" x2="397" y2="875" stroke="#ffad72" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="409" y="879" class="mono" font-size="10" fill="#a8b4b4">DASHED · AWS MANAGED RESOURCE NOT YET DEPLOYED</text>
  <text x="1536" y="879" text-anchor="end" class="mono" font-size="10" fill="#81f1c8">PUBLIC EVIDENCE · GITHUB PAGES STATIC SYNTHETIC REPLAY</text>
</svg>
