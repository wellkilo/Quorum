[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "quorum-agent"
version = "0.1.0"
description = "A low-interruption coordination agent for small groups."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "wellkilo", email = "wellkilo@foxmail.com" }]
dependencies = [
  "google-api-python-client==2.199.0",
  "google-auth==2.57.0",
  "pydantic==2.12.5",
  "slack-sdk==3.43.0",
  "sqlalchemy==2.0.52",
  "strands-agents==1.53.0",
]

[project.optional-dependencies]
dev = [
  "alembic==1.19.1",
  "mypy==1.19.1",
  "ruff==0.15.5",
]
postgres = [
  "alembic==1.19.1",
  "psycopg[binary]==3.3.4",
]
runtime = [
  "aws-opentelemetry-distro==0.19.0",
  "bedrock-agentcore==1.22.0",
  "mcp-proxy-for-aws==1.6.4",
]

[project.scripts]
quorum-db = "quorum.database_cli:main"
quorum-eval = "quorum.evaluation:main"
quorum-run-model-eval = "quorum.model_eval:main"
quorum-validate-gold = "quorum.gold:main"
quorum-provision-memory = "quorum.memory:main"
quorum-provision-gateway = "quorum.gateway:main"
quorum-runtime = "quorum.runtime:main"
quorum-slack-smoke = "quorum.slack_smoke:main"
quorum-slack-ingress-smoke = "quorum.slack_ingress_smoke:main"
quorum-slack-live-evidence = "quorum.slack_live_evidence:main"
quorum-slack-socket = "quorum.slack_socket:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quorum"]
artifacts = ["src/quorum/slack-app-manifest.json"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "quorum/alembic.ini"
"migrations" = "quorum/migrations"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/test_redact_chat.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["quorum"]
mypy_path = "src"
